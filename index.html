<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Coordernadas</title>
    <link rel="shortcut icon" href="placeholder.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    h1 {
        text-align: center;
        padding: 20px 0;
        margin: 0;
        background: #333;
        color: white;
    }

    #map {
        width: 100%;
        height: 100vh;
        cursor: none;
        position: relative;
        overflow: hidden;
    }

    #guideOverlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 450;
        opacity: 0;
        transition: opacity 0.12s ease;
    }

    #guideOverlay.visible {
        opacity: 1;
    }

    #guideVertical,
    #guideHorizontal {
        position: absolute;
        background: rgba(9, 1, 1, 0.95);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    #guideVertical {
        top: 0;
        bottom: 0;
        width: 1px;
        transform: translateX(-50%);
    }

    #guideHorizontal {
        left: 0;
        right: 0;
        height: 1px;
        transform: translateY(-50%);
    }

    #coords {
        position: absolute;
        bottom: 15px;
        left: 15px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 14px;
    }
</style>

<body>

    <!-- <h1>Mapa Satélite</h1> -->

    <div id="coords">Lat: | Lon:</div>

    <div id="map">
        <div id="guideOverlay" aria-hidden="true">
            <div id="guideVertical"></div>
            <div id="guideHorizontal"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


</body>

<script>

    // Inicializa o mapa
    const map = L.map("map", {
        zoomControl: true,
        minZoom: 1,
        maxZoom: 30
    });

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 30,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);
    // Exibe coordenadas do mouse
    const coords = document.getElementById("coords");
    const guideOverlay = document.getElementById("guideOverlay");
    const guideVertical = document.getElementById("guideVertical");
    const guideHorizontal = document.getElementById("guideHorizontal");

    function updateGuide(e) {
        guideVertical.style.left = `${e.containerPoint.x}px`;
        guideHorizontal.style.top = `${e.containerPoint.y}px`;
        guideOverlay.classList.add("visible");
    }

    function hideGuide() {
        guideOverlay.classList.remove("visible");
    }

    map.on("mousemove", function (e) {
        updateGuide(e);
        coords.innerHTML =
            `Lat: ${e.latlng.lat.toFixed(6)} | Lon: ${e.latlng.lng.toFixed(6)}`;
    });

    map.on("mouseout", hideGuide);

    // Copia coordenadas ao clicar
    map.on("click", function (e) {
        updateGuide(e);

        const texto = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;

        navigator.clipboard.writeText(texto);

        L.popup()
            .setLatLng(e.latlng)
            .setContent(`
            <b>Coordenadas</b><br>
            ${texto}<br><br>
            ✅ Copiado para a área de transferência
        `)
            .openOn(map);

    });

    // Mantém o mapa sem marcadores
    map.setView([0, 0], 2);


</script>

</html>
